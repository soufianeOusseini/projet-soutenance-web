<div class="app-body">

  <!-- Container starts -->
  <div class="container-fluid">

    <!-- Row start -->
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <h4 class="card-title">Agences</h4>
          </div>
          <div class="card-body">
            <div class="d-flex justify-content-end mb-2">
              <button secured permission="AGENCY_ADD" type="button" class="btn btn-primary" (click)="add()">
                <i class="ri-add-line align-middle me-1"></i> Ajouter une agence
              </button>
            </div>

            <div class="table-outer">
              <div class="table-responsive">
                <table class="table align-middle custom-table m-0">
                  <thead>
                  <tr class="bg-light">
                    <th>Nom</th>
                    <th>Code</th>
                    <th>Téléphone</th>
                    <th>Email</th>
                    <th>Ville</th>
                    <th>Région</th>
                    <th>Responsable</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr *ngFor="let agency of agencies">
                    <td>{{ agency.name }}</td>
                    <td>{{ agency.code }}</td>
                    <td>{{ agency.telephone }}</td>
                    <td>{{ agency.email }}</td>
                    <td>{{ agency.city }}</td>
                    <td>{{ agency.region }}</td>
                    <td>{{ agency.managerName }}</td>
                    <td>
                      <span class="badge bg-{{ getStatusClass(agency.status) }}">
                        {{ getStatusLabel(agency.status) }}
                      </span>
                    </td>
                    <td>
                      <div class="d-flex gap-2">
                        <button secured permission="AGENCY_EDIT" class="btn btn-sm btn-info" (click)="edit(agency)">
                          <i class="ri-edit-line"></i>
                        </button>
                        <button secured permission="AGENCY_DELETE" class="btn btn-sm btn-danger" (click)="confirmDelete(agency.id)">
                          <i class="ri-delete-bin-line"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                  <tr *ngIf="agencies.length === 0">
                    <td colspan="9" class="text-center">
                      Aucune agence trouvée
                    </td>
                  </tr>
                  </tbody>
                </table>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

  </div>

</div>
