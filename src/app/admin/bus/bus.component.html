<div class="app-body">

  <!-- Container starts -->
  <div class="container-fluid">

    <!-- Row start -->
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <h4 class="card-title">Liste des Bus</h4>
          </div>
          <div class="card-body">
            <div class="d-flex justify-content-end mb-2">
              <button secured permission="BUS_ADD" type="button" class="btn btn-primary" (click)="add()">
                <i class="ri-add-line align-bottom me-1"></i> Ajouter un bus
              </button>
            </div>

            <!-- Message si aucun bus -->
            <div *ngIf="!isLoading && buses.length === 0" class="text-center my-5">
              <i class="ri-bus-line" style="font-size: 3rem;"></i>
              <p class="mt-2">Aucun bus disponible. Cliquez sur "Ajouter un bus" pour commencer.</p>
            </div>

            <!-- Tableau des bus -->
            <div class="table-outer" *ngIf="!isLoading && buses.length > 0">
              <div class="table-responsive">
                <table class="table align-middle custom-table m-0">
                  <thead>
                  <tr class="bg-light">
                    <th>Numéro</th>
                    <th>Modèle</th>
                    <th>Plaque</th>
                    <th>Type</th>
                    <th>Capacité</th>
                    <th>Statut</th>
                    <th>Actions</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr *ngFor="let bus of buses">
                    <td>{{ bus.number }}</td>
                    <td>{{ bus.model }}</td>
                    <td>{{ bus.plaque }}</td>
                    <td>{{ bus.type }}</td>
                    <td>{{ bus.capacity }}</td>
                    <td>
                        <span [class]="getStatusBadgeClass(bus.status)">
                          {{ getStatusLabel(bus.status) }}
                        </span>
                    </td>
                    <td>
                      <div class="d-flex gap-2">
                        <button secured permission="BUS_EDIT" class="btn btn-sm btn-info" (click)="edit(bus)" title="Modifier">
                          <i class="ri-edit-line"></i>
                        </button>
                        <button secured permission="BUS_DELETE" class="btn btn-sm btn-danger" (click)="confirmDelete(bus.id)" title="Supprimer">
                          <i class="ri-delete-bin-line"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
