<div class="modal-header">
  <h5 class="modal-title" id="addUserLabel">Création d'un utilisateur</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('Cross click')"></button>
</div>
<div class="modal-body">
  <div class="row">
    <form action="" [formGroup]="formGroup" (ngSubmit)="save()">
      <div class="col-xl-12 col-12">
        <div class="row">
          <div class="col-6">
            <div class="mb-3">
              <label for="firstName" class="form-label">Prénom</label>
              <input type="text" class="form-control" id="firstName" placeholder="Prénom" formControlName="firstName"/>
              <div *ngIf="formGroup.get('firstName')?.invalid && formGroup.get('firstName')?.touched" class="text-danger small">
                Le prénom est requis
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="lastName" class="form-label">Nom</label>
              <input type="text" class="form-control" id="lastName" placeholder="Nom" formControlName="lastName"/>
              <div *ngIf="formGroup.get('lastName')?.invalid && formGroup.get('lastName')?.touched" class="text-danger small">
                Le nom est requis
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="Email" formControlName="email"/>
              <div *ngIf="formGroup.get('email')?.invalid && formGroup.get('email')?.touched" class="text-danger small">
                <span *ngIf="formGroup.get('email')?.errors?.['required']">L'email est requis</span>
                <span *ngIf="formGroup.get('email')?.errors?.['email']">Format d'email invalide</span>
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="phone" class="form-label">Téléphone</label>
              <input type="text" class="form-control" id="phone" placeholder="Téléphone" formControlName="phone"/>
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="username" class="form-label">Nom d'utilisateur</label>
              <input type="text" class="form-control" id="username" placeholder="Nom d'utilisateur" formControlName="username"/>
              <div *ngIf="formGroup.get('username')?.invalid && formGroup.get('username')?.touched" class="text-danger small">
                Le nom d'utilisateur est requis
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="password" class="form-label">Mot de passe</label>
              <input type="password" class="form-control" id="password" placeholder="Mot de passe" formControlName="password"/>
              <div *ngIf="formGroup.get('password')?.invalid && formGroup.get('password')?.touched" class="text-danger small">
                Le mot de passe est requis
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="defaultLanguage" class="form-label">Langue par défaut</label>
              <select class="form-select" id="defaultLanguage" formControlName="defaultLanguage">
                <option value="FR">Français</option>
                <option value="EN">Anglais</option>
              </select>
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="roles" class="form-label">Rôle</label>
              <select class="form-select" id="roles" formControlName="roleId">
                <option value="">Sélectionner un rôle</option>
                <option *ngFor="let role of roles" [value]="role.id">{{ role.name }}</option>
              </select>
              <div *ngIf="formGroup.get('roleId')?.invalid && formGroup.get('roleId')?.touched" class="text-danger small">
                Le rôle est requis
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
<div class="modal-footer">
  <button
    type="button"
    class="btn btn-danger btn-sm custom-toggle me-1"
    data-bs-toggle="button"
    (click)="reset()"
  >
    <span class="icon-on">
      <i class="ri-close-circle-line align-bottom"></i>
      Effacer
    </span>
  </button>
  <button
    type="button"
    class="btn btn-success btn-sm custom-toggle me-1"
    data-bs-toggle="button"
    [disabled]="formGroup.invalid"
    (click)="save()"
    *ngIf="!formGroup.value.id"
  >
    <span class="icon-on">
      <i class="ri-save-line align-bottom"></i>
      Enregistrer
    </span>
  </button>
  <button
    type="button"
    class="btn btn-success btn-sm custom-toggle me-1"
    data-bs-toggle="button"
    [disabled]="formGroup.invalid"
    *ngIf="formGroup.value.id"
  >
    <span class="icon-on">
      <i class="ri-save-line align-bottom"></i>
      Modifier
    </span>
  </button>
</div>
