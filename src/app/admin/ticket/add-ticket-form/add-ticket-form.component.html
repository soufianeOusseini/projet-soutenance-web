<div class="modal-header">
  <h5 class="modal-title" id="addTicketLabel">Création d'un ticket</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('Cross click')"></button>
</div>
<div class="modal-body">
  <div class="row">
    <form action="" [formGroup]="formGroup" (ngSubmit)="save()">
      <div class="col-xl-12 col-12">
        <div class="row">
          <div class="col-6">
            <div class="mb-3">
              <label for="numero" class="form-label">Numéro *</label>
              <input
                type="text"
                class="form-control"
                id="numero"
                placeholder="Numéro du ticket"
                formControlName="numero"
                [class.is-invalid]="isFieldInvalid('numero')"/>
              <div *ngIf="isFieldInvalid('numero')" class="invalid-feedback">
                Le numéro est obligatoire
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="prix" class="form-label">Prix *</label>
              <input
                type="number"
                class="form-control"
                id="prix"
                placeholder="Prix"
                formControlName="prix"
                step="0.01"
                min="0"
                [class.is-invalid]="isFieldInvalid('prix')"/>
              <div *ngIf="isFieldInvalid('prix')" class="invalid-feedback">
                Le prix est obligatoire
              </div>
            </div>
          </div>
          <div class="col-6">

          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="date" class="form-label">Date *</label>
              <input
                type="date"
                class="form-control"
                id="date"
                formControlName="date"
                [class.is-invalid]="isFieldInvalid('date')"/>
              <div *ngIf="isFieldInvalid('date')" class="invalid-feedback">
                La date est obligatoire
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="heureDepart" class="form-label">Heure de départ *</label>
              <input
                type="time"
                class="form-control"
                id="heureDepart"
                formControlName="heureDepart"
                [class.is-invalid]="isFieldInvalid('heureDepart')"/>
              <div *ngIf="isFieldInvalid('heureDepart')" class="invalid-feedback">
                L'heure de départ est obligatoire
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="modePaiement" class="form-label">Mode de paiement *</label>
              <select
                class="form-control"
                id="modePaiement"
                formControlName="modePaiement"
                [class.is-invalid]="isFieldInvalid('modePaiement')">
                <option value="">Sélectionner un mode de paiement</option>
                <option value="ESPECES">Espèces</option>
                <option value="CARTE_BANCAIRE">Carte bancaire</option>
                <option value="PAYPAL">Paiement mobile</option>
                <option value="VIREMENT">Virement</option>
              </select>
              <div *ngIf="isFieldInvalid('modePaiement')" class="invalid-feedback">
                Le mode de paiement est obligatoire
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="userId" class="form-label">ID Utilisateur</label>
              <input
                type="number"
                class="form-control"
                id="userId"
                placeholder="ID de l'utilisateur"
                formControlName="userId"
                min="1"/>
            </div>
          </div>
          <div class="col-6">
            <div class="mb-3">
              <label for="trajet" class="form-label">Trajet</label>
              <select
                class="form-control"
                id="trajet"
                formControlName="trajetId"
                [class.is-invalid]="isFieldInvalid('trajetId')">

                <option value="">Sélectionner un trajet</option>

                <option *ngFor="let trajet of trajets" [value]="trajet.id">
                  {{ trajet.villeDepart }} → {{ trajet.villeArrive }}
                </option>

              </select>
            </div>

          </div>
        </div>
      </div>
    </form>
  </div>
</div>
<div class="modal-footer">
  <button
    type="button"
    class="btn btn-danger btn-sm custom-toggle me-1"
    data-bs-toggle="button"
    (click)="reset()"
    [disabled]="isSubmitting"
  >
    <span class="icon-on">
      <i class="ri-close-circle-line align-bottom"></i>
      Effacer
    </span>
  </button>
  <button
    type="button"
    class="btn btn-success btn-sm custom-toggle me-1"
    data-bs-toggle="button"
    [disabled]="formGroup.invalid || isSubmitting"
    (click)="save()"
    *ngIf="!formGroup.value.id"
  >
    <span class="icon-on">
      <i class="ri-save-line align-bottom"></i>
      <span *ngIf="!isSubmitting">Enregistrer</span>
      <span *ngIf="isSubmitting">Enregistrement...</span>
    </span>
  </button>
  <button
    type="button"
    class="btn btn-success btn-sm custom-toggle me-1"
    data-bs-toggle="button"
    [disabled]="formGroup.invalid || isSubmitting"
    (click)="save()"
    *ngIf="formGroup.value.id"
  >
    <span class="icon-on">
      <i class="ri-save-line align-bottom"></i>
      <span *ngIf="!isSubmitting">Modifier</span>
      <span *ngIf="isSubmitting">Modification...</span>
    </span>
  </button>
</div>
