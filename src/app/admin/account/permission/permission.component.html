<div class="app-body">
  <!-- Container starts -->
  <div class="container-fluid">
    <!-- Row start -->
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <h4 class="card-title">Modules</h4>
          </div>
          <div class="card-body">
            <div class="row">
              <div class="col-xl-3 col-md-4 col-sm-6 mb-3" *ngFor="let menu of menus">
                <div class="card border border-primary">
                  <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                      <div class="flex-grow-1">
                        <div class="mb-2">
                          <i [class]="menu.icon" class="fs-1 text-primary"></i>
                        </div>
                        <h5 class="card-title mb-0">{{ menu.text }}</h5>
                      </div>
                      <div>
                        <button
                          type="button"
                          class="btn btn-primary btn-sm"
                          (click)="add(menu)"
                          title="Gérer les permissions"
                        >
                          <i class="ri-settings-line"></i>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Message si aucun module avec actions -->
              <div class="col-12" *ngIf="menus.length === 0 && !loading">
                <div class="text-center p-4">
                  <div class="alert alert-info">
                    <i class="ri-information-line fs-2"></i>
                    <h5 class="mt-3">Aucun module disponible</h5>
                    <p class="text-muted mb-0">
                      Aucun module avec des actions de permissions n'a été trouvé.
                    </p>
                  </div>
                </div>
              </div>

              <!-- Loading state -->
              <div class="col-12" *ngIf="loading">
                <div class="text-center p-4">
                  <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Chargement...</span>
                  </div>
                  <p class="mt-2">Chargement des modules...</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
