<div class="app-body">
  <!-- Container starts -->
  <div class="container-fluid">
    <!-- Row start -->
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <h4 class="card-title">Rôles</h4>
          </div>

          <div class="card-body">
            <div class="d-flex justify-content-end mb-2">
              <button type="button" class="btn btn-primary" (click)="add()">
                <i class="ri-add-line align-bottom"></i> Ajouter un rôle
              </button>
            </div>
            <div class="table-outer">
              <div class="table-responsive">
                <table class="table align-middle custom-table m-0">
                  <thead>
                  <tr class="bg-light">
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Actions</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr *ngIf="loading">
                    <td colspan="3" class="text-center">
                      <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                      </div>
                    </td>
                  </tr>
                  <tr *ngIf="!loading && roles.length === 0">
                    <td colspan="3" class="text-center">
                      Aucun rôle disponible
                    </td>
                  </tr>
                  <tr *ngFor="let role of roles">
                    <td>{{ role.id }}</td>
                    <td>{{ role.name }}</td>
                    <td>
                      <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-info" (click)="edit(role)" title="Modifier">
                          <i class="ri-edit-line"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" (click)="confirmDelete(role.id!)" title="Supprimer">
                          <i class="ri-delete-bin-line"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
