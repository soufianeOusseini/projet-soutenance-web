<div class="container-fluid py-4">
  <div class="row g-4">

    <!-- COLONNE GAUCHE : Carte profil entreprise -->
    <div class="col-lg-4">
      <div class="card border-0 shadow-sm sticky-top" style="top: 20px;">
        <!-- Header avec gradient -->
        <div class="card-header border-0 text-white position-relative overflow-hidden"
             style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 2rem 1.5rem;">
          <div class="position-absolute w-100 h-100 top-0 start-0"
               style="background: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%23fff%22 opacity=%220.1%22/></svg>') repeat; opacity: 0.1;"></div>

          <!-- Logo Upload -->
          <div class="position-relative d-inline-block mx-auto">
            <img
              [src]="FileUtility.getImageUrl(formGroup.value?.logoPath)"
              alt="Logo entreprise"
              class="rounded-circle border border-4 border-white shadow-lg"
              style="width: 120px; height: 120px; object-fit: cover; background: white;" />

            <!-- Camera Icon -->
            <div class="position-absolute" style="bottom: 5px; right: 5px;">
              <input
                id="logo-img-file-input"
                type="file"
                class="d-none"
                accept="image/png, image/jpeg, image/jpg"
                (change)="onLogoSelected($event)" />
              <label
                for="logo-img-file-input"
                class="btn btn-light rounded-circle shadow-sm d-flex align-items-center justify-content-center m-0"
                style="width: 40px; height: 40px; cursor: pointer;">
                <i class="ri-camera-fill text-primary fs-5"></i>
              </label>
            </div>
          </div>

          <div *ngIf="logoFileName" class="mt-2">
            <small class="text-white-50">📄 {{ logoFileName }}</small>
          </div>
        </div>

      </div>
      <!-- Section Auto-renouvellement -->
      <div class="col-12 mt-4">
        <div class="card border-primary">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h6 class="mb-1 fw-bold">
                  <i class="ri-refresh-line me-2 text-primary"></i>
                  Renouvellement automatique de l'abonnement
                </h6>
                <small class="text-muted">
                  Votre abonnement sera renouvelé automatiquement à son expiration
                </small>
              </div>
              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="autoRenewSwitch"
                  [checked]="subscription?.autoRenew"
                  (change)="toggleAutoRenew($event)"
                  [disabled]="!subscription || !subscription.active"
                />
                <label class="form-check-label" for="autoRenewSwitch">
            <span class="badge" [class]="subscription?.autoRenew ? 'bg-success' : 'bg-secondary'">
              {{ subscription?.autoRenew ? 'Activé' : 'Désactivé' }}
            </span>
                </label>
              </div>
            </div>

            <!-- Alerte si pas d'abonnement actif -->
            <div class="alert alert-warning mt-3 mb-0" *ngIf="!subscription || !subscription.active">
              <i class="ri-information-line me-2"></i>
              <small>Vous devez avoir un abonnement actif pour activer le renouvellement automatique.</small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- COLONNE DROITE : Contenu avec Tabs -->
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm">

        <!-- Tabs Navigation -->
        <div class="card-header bg-white border-0 px-4 pt-4 pb-0">
          <ul
            ngbNav
            #companyTabs="ngbNav"
            [activeId]="1"
            class="nav nav-pills nav-pills-custom">
            <li [ngbNavItem]="1" class="nav-item">
              <a ngbNavLink class="nav-link d-flex align-items-center gap-2">
                <i class="ri-building-line fs-5"></i>
                <span>Général</span>
              </a>
              <ng-template ngbNavContent>
                <app-general [company]="company" [user]="user" [formGroup]="formGroup"></app-general>
              </ng-template>
            </li>
<!--            <li [ngbNavItem]="2" class="nav-item">-->
<!--              <a ngbNavLink class="nav-link d-flex align-items-center gap-2">-->
<!--                <i class="ri-community-line fs-5"></i>-->
<!--                <span>Agences</span>-->
<!--              </a>-->
<!--              <ng-template ngbNavContent>-->
<!--                <app-agency [company]="company" [user]="user" [formGroup]="formGroup"></app-agency>-->
<!--              </ng-template>-->
<!--            </li>-->
            <li [ngbNavItem]="2" class="nav-item">
              <a ngbNavLink class="nav-link d-flex align-items-center gap-2">
                <i class="ri-wallet-3-line fs-5"></i>
                <span>Comptes</span>
              </a>
              <ng-template ngbNavContent>
                <app-accounts [company]="company" [user]="user" [formGroup]="formGroup"></app-accounts>
              </ng-template>
            </li>
          </ul>
        </div>

        <!-- Contenu scrollable -->
        <div class="card-body p-0">
          <div class="tab-content-wrapper" style="max-height: 60vh; overflow-y: auto;">
            <div class="p-4">
              <div [ngbNavOutlet]="companyTabs"></div>
            </div>
          </div>
        </div>

        <!-- Footer avec boutons d'action -->
        <div class="card-footer bg-light border-top-0">
          <div class="d-flex justify-content-end gap-2">
            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="reset()">
              <i class="ri-close-line me-2"></i>
              Annuler
            </button>

            <button
              type="button"
              class="btn btn-primary"
              [disabled]="formGroup.invalid"
              (click)="save()"
              *ngIf="!formGroup.value?.id">
              <i class="ri-add-line me-2"></i>
              Enregistrer
            </button>

            <button
              type="button"
              class="btn btn-success"
              [disabled]="formGroup.invalid"
              (click)="update()"
              *ngIf="formGroup.value?.id">
              <i class="ri-check-line me-2"></i>
              Mettre à jour
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
