<div class="container-fluid mt-3">
  <div class="row">

    <!-- COLONNE GAUCHE : Informations entreprise -->
    <div class="col-md-4">
      <div class="card text-center">
        <div class="card-body">
          <!-- Logo Upload - Style similaire à school.component -->
          <div class="profile-user position-relative d-inline-block mx-auto mb-4">
            <!-- Profile Image avec gestion dynamique du logo -->
            <img
              [src]="FileUtility.getImageUrl(formGroup.value?.logoPath)"
              alt="Logo entreprise"
              class="rounded-circle avatar-xl img-thumbnail user-profile-image shadow"
              style="width: 150px; height: 150px; object-fit: cover;" />

            <!-- Camera Icon Overlay - Style identique au school component -->
            <div class="avatar-xs p-0 rounded-circle profile-photo-edit">
              <input
                id="logo-img-file-input"
                type="file"
                class="profile-img-file-input"
                accept="image/png, image/jpeg, image/jpg"
                (change)="onLogoSelected($event)"
                hidden
              />
              <label
                for="logo-img-file-input"
                class="profile-photo-edit avatar-xs"
                style="cursor: pointer;"
              >
                <span class="avatar-title rounded-circle bg-light text-body shadow">
                  <i class="ri-camera-fill" title="Changer le logo"></i>
                </span>
              </label>
            </div>
          </div>

          <!-- Nom du fichier sélectionné -->
          <div *ngIf="logoFileName" class="mb-2">
            <small class="text-muted">Fichier sélectionné: {{ logoFileName }}</small>
          </div>

          <!-- Infos entreprise -->
          <h4 class="mb-1">{{ formGroup.value?.name || company?.name || 'Nom entreprise' }}</h4>
          <p class="text-muted small mb-1">{{ formGroup.value?.address || company?.address }}</p>
          <p class="text-muted small mb-1">{{ formGroup.value?.city || company?.city }}</p>
          <p class="text-muted small">Tél : {{ formGroup.value?.telephone || company?.telephone }}</p>
        </div>
      </div>
    </div>

    <!-- COLONNE DROITE : Tabs -->
    <div class="col-md-8">
      <div class="card">
        <div class="border-bottom px-3 pt-3">
          <ul
            ngbNav
            #companyTabs="ngbNav"
            [activeId]="1"
            class="nav nav-pills"
          >
            <li [ngbNavItem]="1">
              <a ngbNavLink>
                <i class="fas fa-building me-1"></i> Général
              </a>
              <ng-template ngbNavContent>
                <app-general [company]="company" [user]="user" [formGroup]="formGroup"></app-general>
              </ng-template>
            </li>
            <li [ngbNavItem]="2">
              <a ngbNavLink>
                <i class="fas fa-user-cog me-1"></i> Compte
              </a>
              <ng-template ngbNavContent>
                <app-accounts [company]="company" [user]="user" [formGroup]="formGroup"></app-accounts>
              </ng-template>
            </li>
          </ul>
        </div>

        <div class="card-body" data-simplebar style="max-height: 60vh;">
          <div [ngbNavOutlet]="companyTabs"></div>
        </div>

        <!-- Footer avec boutons d'action - Style identique au school component -->
        <div class="card-footer d-flex justify-content-end align-items-end">
          <button
            type="button"
            class="btn btn-danger btn-sm custom-toggle me-1"
            (click)="reset()"
          >
            <span class="icon-on">
              <i class="ri-close-circle-line align-bottom"></i>
              Annuler
            </span>
          </button>

          <button
            type="button"
            class="btn btn-primary btn-sm custom-toggle me-1"
            [disabled]="formGroup.invalid"
            (click)="save()"
            *ngIf="!formGroup.value?.id"
          >
            <span class="icon-on">
              <i class="ri-add-line align-bottom"></i>
              Ajouter
            </span>
          </button>

          <button
            type="button"
            class="btn btn-primary btn-sm custom-toggle me-1"
            [disabled]="formGroup.invalid"
            (click)="update()"
            *ngIf="formGroup.value?.id"
          >
            <span class="icon-on">
              <i class="ri-edit-line align-bottom"></i>
              Mettre à jour
            </span>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
